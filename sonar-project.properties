# SonarCloud project configuration
# Replace YOUR_GITHUB_USERNAME and YOUR_ORG_KEY with your actual SonarCloud
# organization key and project key after creating the project at sonarcloud.io.

sonar.projectKey=YOUR_GITHUB_USERNAME_securebank-cicd-pipeline
sonar.organization=YOUR_ORG_KEY

# Path to the source code to analyse
sonar.sources=src
sonar.tests=test

# JavaScript/Node.js specific settings
sonar.sourceEncoding=UTF-8
